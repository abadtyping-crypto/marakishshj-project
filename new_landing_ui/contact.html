<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abad Typing — Digital Business Card & Contact Info</title>
  <meta name="description" content="Digital business card for Abad Commercial Information Services. Save contact VCF, WhatsApp chat, and location map.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">

  <!-- Instant Desktop Smart Routing Script -->
  <style>html { display: none; }</style>
  <script>
    if (window.innerWidth > 768) {
      window.location.replace('/');
    } else {
      document.documentElement.style.display = 'block';
    }
  </script>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="vcard-wrapper">
    <div class="vcard-container">
      
      <!-- Card Header -->
      <div class="vcard-header">
        <img src="assets/images/logo-1080x1080.png" alt="Abad Typing Logo" class="vcard-avatar d-block">
        <h1 class="vcard-title">ABAD TYPING</h1>
        <p class="vcard-subtitle mb-0">Commercial Information Services</p>
        <span class="badge bg-primary bg-opacity-25 text-info px-3 py-1 mt-2 rounded-pill small fw-bold">
          Government Clearance & Corporate PRO
        </span>
      </div>

      <!-- Card Body -->
      <div class="vcard-body">
        
        <!-- Primary Action Buttons -->
        <div class="vcard-action-grid">
          <a href="assets/abad-typing.vcf" download="abad-typing.vcf" class="vcard-action-btn btn-vcard-save">
            <i class="bi bi-person-badge-fill"></i>
            <span>Save Contact to Phone (.VCF)</span>
          </a>

          <a href="https://wa.me/971551012119" target="_blank" class="vcard-action-btn btn-vcard-wa">
            <i class="bi bi-whatsapp"></i>
            <span>WhatsApp Us</span>
          </a>

          <a href="tel:+971551012119" class="vcard-action-btn">
            <i class="bi bi-telephone-fill"></i>
            <span>Direct Call</span>
          </a>

          <a href="https://maps.app.goo.gl/N18juGGC9Y9K1YQX6" target="_blank" class="vcard-action-btn">
            <i class="bi bi-geo-alt-fill"></i>
            <span>Google Maps</span>
          </a>

          <a href="mailto:info@abadtyping.com" class="vcard-action-btn">
            <i class="bi bi-envelope-fill"></i>
            <span>Send Email</span>
          </a>
        </div>

        <!-- Social Network Channels -->
        <h6 class="text-muted small fw-bold text-uppercase mb-2 text-center">Connect & Follow Us</h6>
        <div class="vcard-social-strip">
          <a href="https://www.facebook.com/abadtypingajm" target="_blank" class="vcard-social-icon" title="Facebook">
            <img src="assets/images/icons/facebook 255x255.png" alt="Facebook">
          </a>
          <a href="https://www.instagram.com/abadtyping" target="_blank" class="vcard-social-icon" title="Instagram">
            <img src="assets/images/icons/instagram 255x255.png" alt="Instagram">
          </a>
          <a href="https://www.tiktok.com/@abadtyping" target="_blank" class="vcard-social-icon" title="TikTok">
            <img src="assets/images/icons/tiktok 255x255.png" alt="TikTok">
          </a>
          <a href="https://www.linkedin.com/company/abadtyping" target="_blank" class="vcard-social-icon" title="LinkedIn">
            <img src="assets/images/icons/linkedin 255x255.png" alt="LinkedIn">
          </a>
          <a href="tel:+971551012119" class="vcard-social-icon" title="Botim">
            <img src="assets/images/icons/botim 255x255.png" alt="Botim">
          </a>
        </div>

        <!-- Location Info -->
        <div class="bg-light p-3 rounded-3 mb-3 text-center">
          <p class="small text-muted mb-1 fw-bold"><i class="bi bi-building me-1 text-primary"></i> Office Address</p>
          <p class="small mb-0 text-dark">Shop 01, Ammar Bin Yasir Street, Al Rashidiya 2, Ajman, UAE</p>
        </div>

        <!-- Payment Accepted Badges -->
        <div class="text-center">
          <p class="small text-muted mb-2 fw-bold">Accepted Payments</p>
          <div class="d-flex justify-content-center align-items-center flex-wrap gap-2">
            <img src="assets/images/icons/card_visa.svg" alt="Visa" class="payment-badge-img">
            <img src="assets/images/icons/card_mastercard.svg" alt="MasterCard" class="payment-badge-img">
            <img src="assets/images/icons/card_american_express.svg" alt="Amex" class="payment-badge-img">
            <img src="assets/images/icons/card_apple_pay.svg" alt="Apple Pay" class="payment-badge-img">
            <img src="assets/images/icons/card_google_pay.svg" alt="Google Pay" class="payment-badge-img">
            <img src="assets/images/icons/tabby 650x450.png" alt="Tabby" class="payment-badge-img">
            <img src="assets/images/icons/tamara 1357x687.png" alt="Tamara" class="payment-badge-img">
          </div>
        </div>

        <!-- Back to Full Site -->
        <div class="text-center mt-4 pt-2 border-top">
          <a href="/" class="small text-primary fw-bold text-decoration-none">
            Visit Full Desktop Site <i class="bi bi-arrow-right"></i>
          </a>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
